schema_version: "1.0"
engine_id: digital-research-skills
display_name: Digital Research Engine
contract_version: "1.0"
version: "1.1.0"
router:
  path: AGENTS.md
skills:
  discovery_glob: skills/**/SKILL.md
validation:
  - id: release-gate
    command: >-
      python -X utf8 scripts/skill_contract_validator.py --baseline tests/skill-engine/quality-baseline.json
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
agent_integration:
  supported_modes: [full, sequential, read_only, not_assessed]
  local_context_files: [AGENTS.md, .skills-engine/AGENTS-INTEGRATION.md]
  mcp_safe_tools: [discover_engine, read_router, read_skill, validate_documented_checks]
  approval_required_for: [write_files, pull, update, publish, external_message]
  forbidden_operations: [git_reset, git_clean, force_push, arbitrary_shell, broad_delete]
  fork_behavior: inspect_local_router_without_inventing_validators
source_of_truth:
  router: AGENTS.md
  skills: skills/**/SKILL.md
  references: references/**
claude_only_block: |
  - Dispatch research waves with the `Agent` tool, `subagent_type: content-marketing:search-specialist`
    (or `general-purpose` if unavailable); one sub-agent per cohort.
  - Run independent waves as multiple `Agent` tool calls in one message.
  - Use background mode (`run_in_background: true`) for waves longer than 2 minutes.
  - Never read sub-agent transcripts or output files directly with the shell tool (no `Bash`-based
    tail) — they overflow context. Use the structured `<result>` block in the completion notification.
  - Tools to use heavily: `Agent` for every research wave; `WebFetch` for URL verification, statistic
    re-check and abstract retrieval; `Read` for cross-checking draft outputs; `Write` / `Edit` for the
    markdown corpus; `Grep` for finding duplicate citations across cohorts (signals triangulation).
invariants:
  - id: british-english
    phrase: "Language standards: British English; East African professional tone; day-month-year dates"
  - id: book-extraction-ban
    phrase: "Book extractions, book summaries and chapter-by-chapter notes must never be stored in this"
  - id: not-assessed
    phrase: "Missing source, locator, currentness, reviewer, or product evidence is `NOT ASSESSED`, never a pass."
  - id: no-hallucination
    phrase: "**Do not hallucinate.** No claim, statistic, quote, name, court case, statute, organisation, or URL"
plugin_exclusions:
  - path: "."
    reason: "repository-level router SKILL.md; the plugin exposes the routed skills under skills/, and the router is read through AGENTS.md"
  - path: "templates/skill-template"
    reason: "authoring template copied when a new skill is created; not an active skill"
