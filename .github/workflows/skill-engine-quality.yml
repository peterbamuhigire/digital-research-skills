name: Skill engine quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - run: python -X utf8 scripts/skill_contract_validator.py --baseline tests/skill-engine/quality-baseline.json
      - run: python -X utf8 scripts/routing_smoke_test.py --min-rank1 84 --lint-fixtures
      - run: python -m pip install pytest && python -m pytest -q -p no:cacheprovider tests/test_routing_ratchet.py
      - run: python -X utf8 scripts/validate_engine.py
      - run: python -X utf8 scripts/validate_source_currency.py tests/fixtures/source-currency.json --as-of 2026-08-06
